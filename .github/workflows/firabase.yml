name: Deploy HTML to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare public folder and firebase.json
        run: |
          mkdir -p public
          cp -r artikel api *.html sitemap.xml feed*.xml robots.txt manifest.json public/ 2>/dev/null || true
          cat << 'EOF' > firebase.json
          {
            "hosting": {
              "public": "public",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ]
            }
          }
          EOF

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_artikelsemua7 }}
          channelId: live
          projectId: artikelsemua7
